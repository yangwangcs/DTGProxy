[package]
name = "query-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["shard-runtime"]
shard-runtime = ["dep:shard-runtime"]
rocksdb-tests = ["dep:adapter-rocksdb", "dep:tempfile"]

[dependencies]
blake3 = "=1.8.5"
adapter-rocksdb = { path = "../adapter-rocksdb", optional = true }
physical-plan = { path = "../physical-plan" }
procedure-runtime = { path = "../procedure-runtime" }
analytics-api = { path = "../analytics-api" }
shard-runtime = { path = "../shard-runtime", optional = true }
storage-api = { path = "../storage-api" }
temporal-ir = { path = "../temporal-ir" }
temporal-storage = { path = "../temporal-storage" }
temporal-types = { path = "../temporal-types" }
tempfile = { version = "3", optional = true }
tokio = { version = "=1.53.0", features = ["macros", "sync", "time"] }

[dev-dependencies]
adapter-memory = { path = "../adapter-memory" }
analytics-ledger = { path = "../analytics-ledger" }
cypher-compiler = { path = "../cypher-compiler" }
query-optimizer = { path = "../query-optimizer" }
raft-command = { path = "../raft-command" }
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
