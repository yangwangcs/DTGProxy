[package]
name = "temporal-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
rocksdb-tests = ["dep:adapter-rocksdb", "dep:tempfile"]

[dependencies]
adapter-rocksdb = { path = "../adapter-rocksdb", optional = true }
storage-api = { path = "../storage-api" }
temporal-types = { path = "../temporal-types" }
tempfile = { version = "3", optional = true }

[dev-dependencies]
adapter-memory = { path = "../adapter-memory" }
temporal-model = { path = "../temporal-model" }

[lints]
workspace = true

[[bench]]
name = "roundtrip"
harness = false
required-features = ["rocksdb-tests"]

[[test]]
name = "rocksdb_roundtrip"
required-features = ["rocksdb-tests"]

[[test]]
name = "randomized_tck"
required-features = ["rocksdb-tests"]

[[test]]
name = "transaction_adapter_tck"
required-features = ["rocksdb-tests"]
