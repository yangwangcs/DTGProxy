[package]
name = "controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = "=1.8.5"
control-plane = { path = "../control-plane" }
cluster-protocol = { path = "../cluster-protocol" }
crc32fast = "=1.5.0"
prost = "=0.14.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
raft-command = { path = "../raft-command" }
tokio = { version = "=1.53.0", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = "=0.1.18"
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }

[dev-dependencies]
data-node = { path = "../data-node" }
storage-api = { path = "../storage-api" }
tempfile = "3"
temporal-types = { path = "../temporal-types" }

[lints]
workspace = true
