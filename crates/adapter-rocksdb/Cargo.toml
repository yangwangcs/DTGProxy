[package]
name = "adapter-rocksdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
adapter-registry = { path = "../adapter-registry" }
blake3 = "=1.8.5"
rocksdb = { version = "=0.24.0", default-features = false, features = ["bindgen-runtime", "lz4", "multi-threaded-cf"] }
storage-api = { path = "../storage-api" }

[dev-dependencies]
storage-api = { path = "../storage-api", features = ["mapping-tck"] }
tempfile = "3"
temporal-storage = { path = "../temporal-storage" }

[lints]
workspace = true
