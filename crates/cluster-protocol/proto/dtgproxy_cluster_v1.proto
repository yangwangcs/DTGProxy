syntax = "proto3";

package dtgproxy.cluster.v1;

// Required on every client and internal request. IDs are fixed-width 16-byte
// values validated by the receiving service before dispatch.
message RequestContext {
  uint32 protocol_version = 1;
  bytes cluster_id = 2;
  bytes request_id = 3;
  uint64 deadline_unix_ms = 4;
}

message ShardContext {
  RequestContext request = 1;
  uint64 graph_id = 2;
  uint32 shard_id = 3;
  uint64 placement_epoch = 4;
}

enum StatusReason {
  STATUS_REASON_UNSPECIFIED = 0;
  STATUS_REASON_NOT_LEADER = 1;
  STATUS_REASON_STALE_EPOCH = 2;
  STATUS_REASON_REVISION_COMPACTED = 3;
  STATUS_REASON_RESOURCE_EXHAUSTED = 4;
}

message StatusDetail {
  StatusReason reason = 1;
  uint64 leader_node_id = 2;
  uint64 current_epoch = 3;
  uint64 current_revision = 4;
  uint64 retry_after_ms = 5;
}

message GetCatalogRequest {
  RequestContext context = 1;
  uint64 minimum_revision = 2;
}

message CatalogSnapshot {
  uint64 revision = 1;
  bytes payload = 2;
  uint32 checksum = 3;
}

message GetCatalogResponse { CatalogSnapshot snapshot = 1; }

message WatchCatalogRequest {
  RequestContext context = 1;
  uint64 after_revision = 2;
}

message CatalogEvent {
  uint64 revision = 1;
  bytes command = 2;
  uint32 checksum = 3;
}

message ProposeRequest {
  RequestContext context = 1;
  bytes command = 2;
}

message ProposeResponse {
  uint64 revision = 1;
  bool duplicate = 2;
}

message ProposeAnalyticsJobRequest {
  RequestContext context = 1;
  bytes command = 2;
}

message ProposeAnalyticsJobResponse {
  uint64 ledger_revision = 1;
  uint64 job_revision = 2;
  bool duplicate = 3;
  bool request_duplicate = 4;
  bytes canonical_job_id = 5;
}

message GetAnalyticsJobRequest {
  RequestContext context = 1;
  bytes job_id = 2;
}

message GetAnalyticsJobResponse {
  uint64 ledger_revision = 1;
  bytes record = 2;
  uint32 checksum = 3;
}

message ListClaimableAnalyticsJobsRequest {
  RequestContext context = 1;
  uint64 now_unix_ms = 2;
  bytes after_job_id = 3;
  uint32 limit = 4;
}

message AnalyticsJobCandidate {
  bytes job_id = 1;
  uint64 job_revision = 2;
  uint64 expired_lease_epoch = 3;
}

message ListClaimableAnalyticsJobsResponse {
  uint64 ledger_revision = 1;
  repeated AnalyticsJobCandidate candidates = 2;
}

message ListAnalyticsJobsRequest {
  RequestContext context = 1;
  bytes after_job_id = 2;
  uint32 limit = 3;
}

message AnalyticsJobRecord {
  bytes job_id = 1;
  bytes record = 2;
  uint32 checksum = 3;
}

message ListAnalyticsJobsResponse {
  uint64 ledger_revision = 1;
  repeated AnalyticsJobRecord jobs = 2;
}

message ListAnalyticsJobTombstonesRequest {
  RequestContext context = 1;
  bytes after_job_id = 2;
  uint32 limit = 3;
}

message AnalyticsJobTombstoneRecord {
  bytes job_id = 1;
  bytes record = 2;
  uint32 checksum = 3;
}

message ListAnalyticsJobTombstonesResponse {
  uint64 ledger_revision = 1;
  repeated AnalyticsJobTombstoneRecord tombstones = 2;
  bytes next_job_id = 3;
}

message AllocateTimestampRequest {
  RequestContext context = 1;
  uint32 count = 2;
  uint64 observed_physical_ms = 3;
}

message AllocateTimestampResponse {
  uint64 first_physical_ms = 1;
  uint32 first_logical = 2;
  uint32 count = 3;
  uint64 lease_high_water_physical_ms = 4;
  uint32 lease_high_water_logical = 5;
}

enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  NODE_ROLE_META = 1;
  NODE_ROLE_DATA = 2;
  NODE_ROLE_GATEWAY = 3;
  NODE_ROLE_CONTROLLER = 4;
}

message HeartbeatRequest {
  RequestContext context = 1;
  uint64 node_id = 2;
  NodeRole role = 3;
  string advertise_address = 4;
  uint64 observed_catalog_revision = 5;
  bytes capacity = 6;
}

message HeartbeatResponse {
  uint64 catalog_revision = 1;
  uint64 lease_expires_unix_ms = 2;
}

message AcquireControllerLeaseRequest {
  RequestContext context = 1;
  uint64 controller_id = 2;
}

message AcquireControllerLeaseResponse {
  uint64 owner_term = 1;
  uint64 lease_expires_unix_ms = 2;
}

message AcquireAnalyticsGcLeaseRequest {
  RequestContext context = 1;
  uint64 gateway_id = 2;
}

message AcquireAnalyticsGcLeaseResponse {
  uint64 owner_term = 1;
  uint64 gc_epoch = 2;
  uint64 lease_expires_unix_ms = 3;
}

service MetaService {
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);
  rpc WatchCatalog(WatchCatalogRequest) returns (stream CatalogEvent);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc ProposeAnalyticsJob(ProposeAnalyticsJobRequest) returns (ProposeAnalyticsJobResponse);
  rpc GetAnalyticsJob(GetAnalyticsJobRequest) returns (GetAnalyticsJobResponse);
  rpc ListClaimableAnalyticsJobs(ListClaimableAnalyticsJobsRequest) returns (ListClaimableAnalyticsJobsResponse);
  rpc ListAnalyticsJobs(ListAnalyticsJobsRequest) returns (ListAnalyticsJobsResponse);
  rpc ListAnalyticsJobTombstones(ListAnalyticsJobTombstonesRequest) returns (ListAnalyticsJobTombstonesResponse);
  rpc AllocateTimestamp(AllocateTimestampRequest) returns (AllocateTimestampResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc AcquireControllerLease(AcquireControllerLeaseRequest) returns (AcquireControllerLeaseResponse);
  rpc AcquireAnalyticsGcLease(AcquireAnalyticsGcLeaseRequest) returns (AcquireAnalyticsGcLeaseResponse);
}

// Internal Meta-group Raft transport. The encoded message is raft-rs' stable
// protobuf representation and is additionally bounded and identity-checked by
// the receiver before it enters the consensus state machine.
message MetaRaftStepRequest {
  RequestContext context = 1;
  uint64 from_node_id = 2;
  uint64 to_node_id = 3;
  bytes message = 4;
}

message MetaRaftStepResponse {
  uint64 current_term = 1;
}

service MetaRaftService {
  rpc Step(MetaRaftStepRequest) returns (MetaRaftStepResponse);
}

message GatewaySubmitRequest {
  RequestContext context = 1;
  bytes request_json = 2;
}

message GatewaySubmitResponse {
  bytes response_json = 1;
}

service GatewayService {
  rpc Submit(GatewaySubmitRequest) returns (GatewaySubmitResponse);
}

message ExecuteRequest {
  ShardContext context = 1;
  bytes command = 2;
}

message ExecuteResponse {
  uint64 raft_index = 1;
  bytes result = 2;
  bool duplicate = 3;
}

message ReadRequest {
  ShardContext context = 1;
  bytes plan = 2;
  bytes read_proof = 3;
}

message ReadResponse {
  uint64 applied_index = 1;
  bytes result = 2;
}

message ScanRequest {
  ShardContext context = 1;
  bytes plan = 2;
  bytes read_proof = 3;
  uint32 maximum_batch_bytes = 4;
}

message ScanBatch {
  uint64 sequence = 1;
  uint64 applied_index = 2;
  bytes arrow_record_batch = 3;
  bool terminal = 4;
}

enum AnalyticsArtifactKind {
  ANALYTICS_ARTIFACT_KIND_UNSPECIFIED = 0;
  ANALYTICS_ARTIFACT_KIND_CHECKPOINT = 1;
  ANALYTICS_ARTIFACT_KIND_RESULT = 2;
}

message PutAnalyticsArtifactChunkRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint64 generation = 4;
  uint64 ordinal = 5;
  bytes previous_digest = 6;
  bytes payload = 7;
  uint64 created_at_unix_ms = 8;
}

message PutAnalyticsArtifactChunkResponse {
  uint64 raft_index = 1;
  bool duplicate = 2;
}

message PinAnalyticsArtifactGenerationRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint64 generation = 4;
  uint32 expected_chunk_count = 5;
  uint64 expected_total_bytes = 6;
  bytes expected_content_digest = 7;
}

message PinAnalyticsArtifactGenerationResponse {
  uint64 raft_index = 1;
  bool duplicate = 2;
}

message GetAnalyticsArtifactGenerationRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint64 generation = 4;
  uint32 expected_chunk_count = 5;
  uint64 expected_total_bytes = 6;
  bytes expected_content_digest = 7;
}

message AnalyticsArtifactChunk {
  uint64 ordinal = 1;
  uint64 applied_index = 2;
  bytes previous_digest = 3;
  bytes payload_digest = 4;
  bytes payload = 5;
}

message DeleteAnalyticsArtifactGenerationRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint64 generation = 4;
  uint64 gc_epoch = 5;
}

message DeleteAnalyticsArtifactGenerationResponse {
  uint64 raft_index = 1;
  bool duplicate = 2;
}

message AdvanceAnalyticsArtifactFenceRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint64 generation = 4;
  uint64 gc_epoch = 5;
}

message AdvanceAnalyticsArtifactFenceResponse {
  uint64 raft_index = 1;
  bool duplicate = 2;
}

message ListAnalyticsArtifactGenerationsRequest {
  ShardContext context = 1;
  bytes job_id = 2;
  AnalyticsArtifactKind kind = 3;
  uint32 limit = 4;
}

message AnalyticsArtifactGeneration {
  bytes job_id = 1;
  AnalyticsArtifactKind kind = 2;
  uint64 generation = 3;
  uint32 expected_chunk_count = 4;
  uint64 expected_total_bytes = 5;
  bytes expected_content_digest = 6;
  bool pinned = 7;
  uint64 applied_index = 8;
  uint64 created_at_unix_ms = 9;
}

message ListAnalyticsArtifactGenerationsResponse {
  uint64 applied_index = 1;
  repeated AnalyticsArtifactGeneration generations = 2;
}

message AnalyticsArtifactGenerationCursor {
  bytes job_id = 1;
  AnalyticsArtifactKind kind = 2;
  uint64 generation = 3;
}

message ListAnalyticsArtifactGenerationHeadsRequest {
  ShardContext context = 1;
  AnalyticsArtifactGenerationCursor after = 2;
  uint32 limit = 3;
}

message ListAnalyticsArtifactGenerationHeadsResponse {
  uint64 applied_index = 1;
  repeated AnalyticsArtifactGeneration generations = 2;
  AnalyticsArtifactGenerationCursor next = 3;
}

message SnapshotChunk {
  ShardContext context = 1;
  bytes migration_id = 2;
  uint64 ordinal = 3;
  bytes payload = 4;
  uint32 checksum = 5;
  bool terminal = 6;
  bytes manifest_digest = 7;
}

message InstallSnapshotResponse {
  bytes migration_id = 1;
  uint64 installed_index = 2;
  bytes content_digest = 3;
  bool duplicate = 4;
}

message ExportSnapshotRequest {
  ShardContext context = 1;
  bytes migration_id = 2;
}

message ReplicaStatusRequest { ShardContext context = 1; }

enum ReplicaRole {
  REPLICA_ROLE_UNSPECIFIED = 0;
  REPLICA_ROLE_LEARNER = 1;
  REPLICA_ROLE_FOLLOWER = 2;
  REPLICA_ROLE_LEADER = 3;
}

message ReplicaStatusResponse {
  uint64 node_id = 1;
  ReplicaRole role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 applied_index = 5;
  uint64 snapshot_index = 6;
  uint64 schema_version = 7;
  uint64 backend_generation = 8;
  bool ready = 9;
}

service ShardService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Scan(ScanRequest) returns (stream ScanBatch);
  rpc PutAnalyticsArtifactChunk(PutAnalyticsArtifactChunkRequest) returns (PutAnalyticsArtifactChunkResponse);
  rpc PinAnalyticsArtifactGeneration(PinAnalyticsArtifactGenerationRequest) returns (PinAnalyticsArtifactGenerationResponse);
  rpc GetAnalyticsArtifactGeneration(GetAnalyticsArtifactGenerationRequest) returns (stream AnalyticsArtifactChunk);
  rpc DeleteAnalyticsArtifactGeneration(DeleteAnalyticsArtifactGenerationRequest) returns (DeleteAnalyticsArtifactGenerationResponse);
  rpc AdvanceAnalyticsArtifactFence(AdvanceAnalyticsArtifactFenceRequest) returns (AdvanceAnalyticsArtifactFenceResponse);
  rpc ListAnalyticsArtifactGenerations(ListAnalyticsArtifactGenerationsRequest) returns (ListAnalyticsArtifactGenerationsResponse);
  rpc ListAnalyticsArtifactGenerationHeads(ListAnalyticsArtifactGenerationHeadsRequest) returns (ListAnalyticsArtifactGenerationHeadsResponse);
  rpc ExportSnapshot(ExportSnapshotRequest) returns (stream SnapshotChunk);
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);
  rpc ReplicaStatus(ReplicaStatusRequest) returns (ReplicaStatusResponse);
}

message EnsureReplicaRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 local_node_id = 3;
  ReplicaRole initial_role = 4;
  uint64 schema_version = 5;
  uint64 backend_generation = 6;
  bytes backend_profile = 7;
}

message BackendProfileSpec {
  string provider = 1;
  string instance_id = 2;
  map<string, string> public_parameters = 3;
  map<string, string> credential_refs = 4;
}

message ReplicaBootstrapProfile {
  uint32 format_version = 1;
  repeated uint64 voters = 2;
  string relative_directory = 3;
  BackendProfileSpec backend = 4;
}

message EnsureReplicaResponse {
  bool created = 1;
  ReplicaStatusResponse status = 2;
}

message ChangeMembershipRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  repeated uint64 old_voters = 3;
  repeated uint64 new_voters = 4;
  repeated uint64 learners = 5;
}

message ChangeMembershipResponse {
  uint64 applied_index = 1;
  bool duplicate = 2;
}

message ActivateReplicaRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 target_placement_epoch = 3;
  repeated uint64 voters = 4;
}

message ActivateReplicaResponse {
  ReplicaStatusResponse status = 1;
  bool duplicate = 2;
}

message DeleteReplicaRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 minimum_safe_index = 3;
}

message DeleteReplicaResponse { bool deleted = 1; }

message GetMigrationReceiptRequest {
  RequestContext context = 1;
  bytes migration_id = 2;
  uint32 step = 3;
}

message GetMigrationReceiptResponse {
  bool present = 1;
  bytes input_digest = 2;
  bytes outcome = 3;
}

message PrepareBackendTargetRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 target_generation = 3;
  BackendProfileSpec target_profile = 4;
}

message PrepareBackendTargetResponse {
  ReplicaStatusResponse status = 1;
  uint64 fence_index = 2;
  bytes target_profile_digest = 3;
}

message BeginBackendDualApplyRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 source_generation = 3;
  uint64 target_generation = 4;
  bytes target_profile_digest = 5;
  uint64 fence_index = 6;
}

message FinishBackendMigrationRequest {
  ShardContext context = 1;
  bytes operation_id = 2;
  uint64 source_generation = 3;
  uint64 target_generation = 4;
  bytes target_profile_digest = 5;
}

message BackendTransitionResponse {
  ReplicaStatusResponse status = 1;
  bool duplicate = 2;
}

enum BackendLifecyclePhase {
  BACKEND_LIFECYCLE_PHASE_UNSPECIFIED = 0;
  BACKEND_LIFECYCLE_PHASE_ACTIVE = 1;
  BACKEND_LIFECYCLE_PHASE_DUAL_APPLYING = 2;
}

message GetBackendStatusRequest { ShardContext context = 1; }

message GetBackendStatusResponse {
  ReplicaStatusResponse status = 1;
  BackendLifecyclePhase phase = 2;
  uint64 source_generation = 3;
  uint64 target_generation = 4;
  bytes target_profile_digest = 5;
  uint64 fence_index = 6;
  uint64 synchronized_index = 7;
}

service NodeAdminService {
  rpc EnsureReplica(EnsureReplicaRequest) returns (EnsureReplicaResponse);
  rpc ChangeMembership(ChangeMembershipRequest) returns (ChangeMembershipResponse);
  rpc ActivateReplica(ActivateReplicaRequest) returns (ActivateReplicaResponse);
  rpc DeleteReplica(DeleteReplicaRequest) returns (DeleteReplicaResponse);
  rpc GetMigrationReceipt(GetMigrationReceiptRequest) returns (GetMigrationReceiptResponse);
  rpc PrepareBackendTarget(PrepareBackendTargetRequest) returns (PrepareBackendTargetResponse);
  rpc BeginBackendDualApply(BeginBackendDualApplyRequest) returns (BackendTransitionResponse);
  rpc CutoverBackend(FinishBackendMigrationRequest) returns (BackendTransitionResponse);
  rpc AbortBackendMigration(FinishBackendMigrationRequest) returns (BackendTransitionResponse);
  rpc GetBackendStatus(GetBackendStatusRequest) returns (GetBackendStatusResponse);
}
