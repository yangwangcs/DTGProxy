[package]
name = "dtg-shard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
dtg-kernel = { path = "../../kernel/dtg-kernel" }
dtg-storage = { path = "../../storage/dtg-storage" }
raft = { version = "=0.7.0", default-features = false, features = ["prost-codec"] }
slog = "2"
tokio = { version = "=1.53.0", features = ["net", "rt-multi-thread", "time"] }

[dev-dependencies]
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall", features = ["tck"] }
tempfile = "3"
