[package]
name = "dtg-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
dtg-analytics = { path = "../dtg-analytics" }
dtg-cluster-protocol = { path = "../dtg-cluster-protocol" }
dtg-control = { path = "../dtg-control" }
dtg-language = { path = "../../language/dtg-language" }
dtg-language-ir = { path = "../../language/dtg-language-ir" }
dtg-plan = { path = "../dtg-plan" }
dtg-query = { path = "../dtg-query" }
dtg-shard = { path = "../dtg-shard" }
dtg-snapshot-csr = { path = "../dtg-snapshot-csr" }
dtg-storage = { path = "../../storage/dtg-storage" }
dtg-transaction = { path = "../dtg-transaction" }
raft = { version = "=0.7.0", default-features = false, features = ["prost-codec"] }
prost-011 = { package = "prost", version = "=0.11.9" }
tonic = { version = "=0.14.6", features = ["transport"] }
slog = "=2.8.2"
sha2 = "=0.11.0"
serde_json = "=1.0.145"
futures-util = "=0.3.33"
tokio = { version = "=1.53.0", features = ["rt", "sync"] }
tokio-stream = "=0.1.18"

[dev-dependencies]
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall" }
tempfile = "3"
tokio = { version = "=1.53.0", features = ["macros", "net", "rt-multi-thread"] }
