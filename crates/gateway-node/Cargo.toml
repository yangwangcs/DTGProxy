[package]
name = "gateway-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cluster-protocol = { path = "../cluster-protocol" }
control-plane = { path = "../control-plane" }
crc32fast = "=1.5.0"
bolt-protocol = { path = "../bolt-protocol" }
bolt-server = { path = "../bolt-server" }
cypher-engine = { path = "../cypher-engine" }
cypher-compiler = { path = "../cypher-compiler" }
distributed-query = { path = "../distributed-query" }
dtgproxy = { path = "../dtgproxy" }
query-executor = { path = "../query-executor" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
shard-client = { path = "../shard-client" }
temporal-ir = { path = "../temporal-ir" }
temporal-query = { path = "../temporal-query" }
temporal-storage = { path = "../temporal-storage" }
temporal-types = { path = "../temporal-types" }
timestamp-oracle = { path = "../timestamp-oracle" }
tokio = { version = "=1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
txn-protocol = { path = "../txn-protocol" }

[dev-dependencies]
data-node = { path = "../data-node" }
meta-node = { path = "../meta-node" }
raft-command = { path = "../raft-command" }
storage-api = { path = "../storage-api" }
tempfile = "3"

[lints]
workspace = true
