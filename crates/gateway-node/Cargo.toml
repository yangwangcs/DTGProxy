[package]
name = "gateway-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
three-backend-certification = []

[dependencies]
blake3 = "=1.8.5"
cluster-protocol = { path = "../cluster-protocol" }
analytics-api = { path = "../analytics-api" }
analytics-ledger = { path = "../analytics-ledger" }
analytics-runtime = { path = "../analytics-runtime" }
control-plane = { path = "../control-plane" }
crc32fast = "=1.5.0"
bolt-protocol = { path = "../bolt-protocol" }
bolt-server = { path = "../bolt-server" }
cypher-engine = { path = "../cypher-engine" }
cypher-compiler = { path = "../cypher-compiler" }
cypher-ast = { path = "../cypher-ast" }
cypher-syntax = { path = "../cypher-syntax" }
distributed-query = { path = "../distributed-query" }
dtgproxy = { path = "../dtgproxy" }
query-executor = { path = "../query-executor" }
procedure-runtime = { path = "../procedure-runtime" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
shard-client = { path = "../shard-client" }
storage-api = { path = "../storage-api" }
temporal-ir = { path = "../temporal-ir" }
temporal-storage = { path = "../temporal-storage" }
temporal-types = { path = "../temporal-types" }
timestamp-oracle = { path = "../timestamp-oracle" }
tokio = { version = "=1.53.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
txn-protocol = { path = "../txn-protocol" }

[dev-dependencies]
adapter-neo4j = { path = "../adapter-neo4j" }
adapter-postgres = { path = "../adapter-postgres" }
adapter-rocksdb = { path = "../adapter-rocksdb" }
adapter-sidecar = { path = "../adapter-sidecar" }
data-node = { path = "../data-node" }
meta-node = { path = "../meta-node" }
raft-command = { path = "../raft-command" }
tempfile = "3"

[[test]]
name = "three_backend_deployment"
required-features = ["three-backend-certification"]

[lints]
workspace = true
