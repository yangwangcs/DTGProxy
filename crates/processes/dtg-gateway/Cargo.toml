[package]
name = "dtg-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "dtgproxy-gateway"
path = "src/main.rs"

[dependencies]
dtg-execution = { path = "../../execution/dtg-execution" }
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
dtg-controller = { path = "../dtg-controller" }
dtg-data = { path = "../dtg-data" }
dtg-meta = { path = "../dtg-meta" }
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall", features = ["tck"] }
dtg-storage-kuzu = { path = "../../storage/dtg-storage-kuzu" }
dtg-storage-postgres = { path = "../../storage/dtg-storage-postgres" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tonic = { version = "=0.14.6", features = ["transport"] }
