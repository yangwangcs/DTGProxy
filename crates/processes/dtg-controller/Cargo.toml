[package]
name = "dtg-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dtg-execution = { path = "../../execution/dtg-execution" }
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"

[lints]
workspace = true

[dev-dependencies]
dtg-cluster-protocol = { path = "../../execution/dtg-cluster-protocol" }
dtg-control = { path = "../../execution/dtg-control" }
tempfile = "3"
tokio = { version = "=1.53.0", features = ["macros", "rt-multi-thread"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen"] }

[[bin]]
name = "dtgproxy-controller"
path = "src/main.rs"
