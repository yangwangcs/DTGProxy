[package]
name = "dtg-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "dtgproxy-data"
path = "src/main.rs"

[dependencies]
dtg-execution = { path = "../../execution/dtg-execution" }
futures-util = "=0.3.33"
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall" }
dtg-storage-kuzu = { path = "../../storage/dtg-storage-kuzu" }
dtg-storage-postgres = { path = "../../storage/dtg-storage-postgres" }
dtg-storage-remote = { path = "../../storage/dtg-storage-remote" }
prost-011 = { package = "prost", version = "=0.11.9" }
raft = { version = "=0.7.0", default-features = false, features = ["prost-codec"] }
tokio = { version = "=1.53.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }

[dev-dependencies]
dtg-execution = { path = "../../execution/dtg-execution", features = ["test-support"] }
dtg-language-ir = { path = "../../language/dtg-language-ir" }
dtg-storage-fjall = { path = "../../storage/dtg-storage-fjall", features = ["tck"] }
tempfile = "=3.27.0"
