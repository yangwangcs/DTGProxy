[package]
name = "bolt-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = "=1.8.5"
bolt-protocol = { path = "../bolt-protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.0", features = ["rt", "macros", "io-util", "net", "time"] }

[lints]
workspace = true
