[package]
name = "dtgproxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
three-backend-certification = []

[dependencies]
adapter-neo4j = { path = "../adapter-neo4j" }
adapter-postgres = { path = "../adapter-postgres" }
adapter-registry = { path = "../adapter-registry" }
adapter-rocksdb = { path = "../adapter-rocksdb" }
adapter-sidecar = { path = "../adapter-sidecar" }
blake3 = "=1.8.5"
control-plane = { path = "../control-plane" }
query-executor = { path = "../query-executor" }
raft-command = { path = "../raft-command" }
raft-transport = { path = "../raft-transport" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
shard-client = { path = "../shard-client" }
shard-runtime = { path = "../shard-runtime" }
storage-api = { path = "../storage-api" }
temporal-ir = { path = "../temporal-ir" }
temporal-storage = { path = "../temporal-storage" }
temporal-types = { path = "../temporal-types" }
timestamp-oracle = { path = "../timestamp-oracle" }
txn-protocol = { path = "../txn-protocol" }

[dev-dependencies]
adapter-memory = { path = "../adapter-memory" }
analytics-api = { path = "../analytics-api" }
analytics-runtime = { path = "../analytics-runtime" }
cluster-protocol = { path = "../cluster-protocol" }
data-node = { path = "../data-node" }
raft = { version = "=0.7.0", default-features = false, features = ["prost-codec"] }
raft-logstore = { path = "../raft-logstore" }
replica-snapshot = { path = "../replica-snapshot" }
tempfile = "3"
tokio = { version = "=1.53.0", features = ["rt", "macros", "sync", "net", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.6", features = ["transport"] }

[[test]]
name = "three_backend_migration"
required-features = ["three-backend-certification"]

[lints]
workspace = true
