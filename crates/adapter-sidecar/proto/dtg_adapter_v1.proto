syntax = "proto3";

package dtg.adapter.v1;

// Canonical source document for the hand-derived Rust prost messages. Keeping the
// generated shape in source avoids requiring protoc in end-user builds.
message LogicalKey { uint32 keyspace = 1; bytes key = 2; }
message Mutation { uint32 sequence = 1; uint32 operation = 2; LogicalKey key = 3; bytes value = 4; }
message ApplyRequest { uint32 shard_id = 1; uint64 log_index = 2; bytes txn_id = 3; repeated Mutation mutations = 4; }
message MultiGetRequest { repeated LogicalKey keys = 1; }
message ScanRequest {
  uint32 keyspace = 1;
  bytes start = 2;
  bool has_end = 3;
  bytes end = 4;
  bool has_required_prefix = 5;
  bytes required_prefix = 6;
  bool has_limit = 7;
  uint64 limit = 8;
  bool has_max_bytes = 9;
  uint64 max_bytes = 10;
}
message HelloRequest {
  uint64 required_features = 1;
  uint64 optional_features = 2;
  uint32 max_payload_bytes = 3;
}
message SnapshotLimits { uint32 max_entries = 1; uint32 max_bytes = 2; }
message SnapshotHeader { uint32 format_version = 1; bytes snapshot_id = 2; uint64 applied_log_index = 3; }
message SnapshotChunk {
  bytes snapshot_id = 1;
  uint64 ordinal = 2;
  repeated KeyValue entries = 3;
  bytes digest = 4;
}
message SnapshotManifest {
  SnapshotHeader header = 1;
  uint64 total_chunks = 2;
  uint64 total_entries = 3;
  bytes content_digest = 4;
}
message PublicParameter { string name = 1; string value = 2; }
message PublicAdapterOpenRequest { string instance_id = 1; repeated PublicParameter parameters = 2; }
message BeginExportRequest { SnapshotLimits limits = 1; optional uint64 expected_applied_log_index = 2; }
message ExportNextRequest { bytes session_id = 1; uint64 expected_ordinal = 2; }
message BeginRestoreRequest { SnapshotHeader header = 1; PublicAdapterOpenRequest target = 2; }
message RestoreChunkRequest { bytes session_id = 1; SnapshotChunk chunk = 2; }
message FinishRestoreRequest { bytes session_id = 1; SnapshotManifest manifest = 2; }
message AbortSessionRequest { bytes session_id = 1; }
message BeginReadViewRequest {}
message ReadViewMultiGetRequest { bytes session_id = 1; repeated LogicalKey keys = 2; }
message ReadViewScanRequest { bytes session_id = 1; ScanRequest span = 2; }
message CanonicalScanRequest { ScanRequest span = 1; uint64 max_items = 2; uint64 max_bytes = 3; }
message ReadViewCanonicalScanRequest { bytes session_id = 1; CanonicalScanRequest request = 2; }
message CanonicalBatchScanRequest { repeated CanonicalScanRequest scans = 1; uint64 max_total_bytes = 2; }
message ReadViewCanonicalBatchScanRequest { bytes session_id = 1; CanonicalBatchScanRequest request = 2; }
message GraphValueList { repeated GraphValue values = 1; }
message GraphValue {
  oneof kind {
    bool null_value = 1;
    bool boolean_value = 2;
    int64 integer_value = 3;
    fixed64 float_bits = 4;
    string string_value = 5;
    bytes bytes_value = 6;
    int64 timestamp_micros = 7;
    GraphValueList list_value = 8;
  }
}
message PropertyConstraint { uint32 property_id = 1; uint32 operator = 2; GraphValue value = 3; }
message CandidateScanRequest {
  ScanRequest span = 1;
  int64 valid_time_micros = 2;
  repeated PropertyConstraint constraints = 3;
  uint64 max_items = 4;
  uint64 max_bytes = 5;
}
message ReadViewCandidateScanRequest { bytes session_id = 1; CandidateScanRequest request = 2; }
message EndReadViewRequest { bytes session_id = 1; }
message RequestEnvelope {
  uint32 spi_version = 1;
  oneof body {
    bool describe = 2;
    ApplyRequest apply = 3;
    MultiGetRequest multi_get = 4;
    ScanRequest scan = 5;
    bool applied_log_index = 6;
    bool health = 7;
    HelloRequest hello = 8;
    BeginExportRequest begin_export = 9;
    ExportNextRequest export_next = 10;
    BeginRestoreRequest begin_restore = 11;
    RestoreChunkRequest restore_chunk = 12;
    FinishRestoreRequest finish_restore = 13;
    AbortSessionRequest abort_session = 14;
    BeginReadViewRequest begin_read_view = 15;
    ReadViewMultiGetRequest read_view_multi_get = 16;
    ReadViewScanRequest read_view_scan = 17;
    EndReadViewRequest end_read_view = 18;
    ReadViewCanonicalScanRequest read_view_canonical_scan = 19;
    ReadViewCandidateScanRequest read_view_candidate_scan = 20;
    ReadViewCanonicalBatchScanRequest read_view_canonical_batch_scan = 21;
  }
}

message Capabilities {
  bool local_atomic_batch = 1;
  bool idempotent_apply = 2;
  bool consistent_multi_get = 3;
  bool ordered_scan = 4;
  bool durable_applied_index = 5;
  uint32 durability = 6;
  uint32 snapshot = 7;
  bool predicate_pushdown = 8;
  bool adjacency_pushdown = 9;
  bool change_feed = 10;
  bool logical_export = 11;
  bool logical_restore = 12;
}
message DescriptorResponse {
  uint32 spi_version = 1;
  string implementation = 2;
  string implementation_version = 3;
  uint32 family = 4;
  Capabilities capabilities = 5;
}
message ApplyResponse { uint64 applied_log_index = 1; bool duplicate = 2; }
message OptionalBytes { bool present = 1; bytes value = 2; }
message MultiGetResponse { repeated OptionalBytes values = 1; }
message KeyValue { LogicalKey key = 1; bytes value = 2; }
message ScanResponse { repeated KeyValue values = 1; }
message HealthResponse { bool ready = 1; string detail = 2; }
message ErrorResponse {
  uint32 code = 1;
  string message = 2;
  bool retryable = 3;
  bool has_scan_byte_limit = 4;
  uint64 scan_limit = 5;
  uint64 scan_required = 6;
  bool has_scan_response_byte_limit = 7;
  uint64 scan_response_limit = 8;
  uint64 scan_response_required = 9;
}
enum RemoteErrorCode {
  REMOTE_ERROR_CODE_UNSPECIFIED = 0;
  FEATURE_UNSUPPORTED = 100;
  NOT_ACTIVE = 101;
  RESOURCE_EXHAUSTED = 102;
  SESSION_UNKNOWN = 103;
  SESSION_EXPIRED = 104;
  SESSION_KIND_MISMATCH = 105;
  SESSION_BUSY = 106;
  ORDINAL_GAP = 107;
  ORDINAL_REGRESSION = 108;
  CHUNK_DIGEST_MISMATCH = 109;
  REQUEST_REPLAY_MISMATCH = 110;
  TERMINAL_REPLAY_MISMATCH = 111;
  RESTORE_ALREADY_IN_PROGRESS = 112;
  SERVICE_FAULTED = 113;
  TARGET_REQUEST_MISMATCH = 114;
  MAPPING_INCOMPATIBLE = 115;
}
message HelloResponse {
  uint32 wire_version = 1;
  uint64 negotiated_features = 2;
  uint32 max_payload_bytes = 3;
  uint32 max_chunk_bytes = 4;
  uint32 max_chunk_entries = 5;
  uint32 snapshot_format_version = 6;
}
message ExportStartedResponse { bytes session_id = 1; SnapshotHeader header = 2; SnapshotLimits limits = 3; }
message ExportChunkResponse { bytes session_id = 1; SnapshotChunk chunk = 2; }
message ExportCompleteResponse { bytes session_id = 1; SnapshotManifest manifest = 2; }
message RestoreStartedResponse {
  bytes session_id = 1;
  DescriptorResponse prospective_descriptor = 2;
  uint32 max_chunk_bytes = 3;
  uint32 max_chunk_entries = 4;
}
message RestoreChunkAcceptedResponse { bytes session_id = 1; uint64 ordinal = 2; bytes digest = 3; }
message RestoreCompleteResponse {
  bytes session_id = 1;
  DescriptorResponse final_descriptor = 2;
  uint64 applied_log_index = 3;
}
message SessionAbortedResponse { bytes session_id = 1; }
message ReadViewStartedResponse { bytes session_id = 1; uint64 applied_log_index = 2; }
message ReadViewMultiGetResponse { bytes session_id = 1; repeated OptionalBytes values = 2; }
message ReadViewScanResponse { bytes session_id = 1; repeated KeyValue values = 2; }
message ReadViewCanonicalScanResponse {
  bytes session_id = 1;
  uint64 applied_log_index = 2;
  repeated KeyValue entries = 3;
  LogicalKey next_start = 4;
}
message ReadViewCandidateScanResponse {
  bytes session_id = 1;
  uint64 applied_log_index = 2;
  uint32 guarantee = 3;
  repeated KeyValue entries = 4;
  LogicalKey next_start = 5;
}
message CanonicalScanPageResponse {
  repeated KeyValue entries = 1;
  LogicalKey next_start = 2;
}
message ReadViewCanonicalBatchScanResponse {
  bytes session_id = 1;
  uint64 applied_log_index = 2;
  repeated CanonicalScanPageResponse pages = 3;
}
message ReadViewEndedResponse { bytes session_id = 1; }
message ResponseEnvelope {
  uint32 spi_version = 1;
  oneof body {
    DescriptorResponse descriptor = 2;
    ApplyResponse apply = 3;
    MultiGetResponse multi_get = 4;
    ScanResponse scan = 5;
    uint64 applied_log_index = 6;
    HealthResponse health = 7;
    ErrorResponse error = 8;
    HelloResponse hello = 9;
    ExportStartedResponse export_started = 10;
    ExportChunkResponse export_chunk = 11;
    ExportCompleteResponse export_complete = 12;
    RestoreStartedResponse restore_started = 13;
    RestoreChunkAcceptedResponse restore_chunk_accepted = 14;
    RestoreCompleteResponse restore_complete = 15;
    SessionAbortedResponse session_aborted = 16;
    ReadViewStartedResponse read_view_started = 17;
    ReadViewMultiGetResponse read_view_multi_get = 18;
    ReadViewScanResponse read_view_scan = 19;
    ReadViewEndedResponse read_view_ended = 20;
    ReadViewCanonicalScanResponse read_view_canonical_scan = 21;
    ReadViewCandidateScanResponse read_view_candidate_scan = 22;
    ReadViewCanonicalBatchScanResponse read_view_canonical_batch_scan = 23;
  }
}
