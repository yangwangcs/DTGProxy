[workspace]
members = [
    "crates/cluster-protocol",
    "crates/data-node",
    "crates/meta-node",
    "crates/shard-client",
    "crates/gateway-node",
    "crates/controller",
    "crates/temporal-types",
    "crates/temporal-semantics",
    "crates/timestamp-oracle",
    "crates/txn-protocol",
    "crates/control-plane",
    "crates/temporal-model",
    "crates/storage-api",
    "crates/adapter-registry",
    "crates/adapter-sidecar",
    "crates/raft-command",
    "crates/shard-runtime",
    "crates/replica-snapshot",
    "crates/raft-logstore",
    "crates/raft-transport",
    "crates/adapter-memory",
    "crates/adapter-rocksdb",
    "crates/adapter-postgres",
    "crates/adapter-neo4j",
    "crates/temporal-storage",
    "crates/temporal-ir",
    "crates/query-executor",
    "crates/cypher-ast",
    "crates/cypher-syntax",
    "crates/cypher-sema",
    "crates/cypher-compiler",
    "crates/bolt-protocol",
    "crates/bolt-server",
    "crates/physical-plan",
    "crates/query-optimizer",
    "crates/distributed-query",
    "crates/cypher-engine",
    "crates/paper-benchmark",
    "crates/analytics-api",
    "crates/analytics-ledger",
    "crates/analytics-runtime",
    "crates/procedure-runtime",
    "crates/dtgproxy",
    "crates/kernel/dtg-kernel",
    "crates/language/dtg-language-ir",
    "crates/language/dtg-language",
    "crates/storage/dtg-storage",
    "crates/storage/dtg-storage-fjall",
    "crates/storage/dtg-storage-postgres",
    "crates/storage/dtg-storage-neo4j",
    "crates/storage/dtg-storage-remote-protocol",
    "crates/storage/dtg-storage-remote",
    "crates/execution/dtg-plan",
    "crates/execution/dtg-query",
    "crates/execution/dtg-transaction",
    "crates/execution/dtg-shard",
    "crates/execution/dtg-analytics",
    "crates/execution/dtg-control",
    "crates/execution/dtg-cluster-protocol",
    "crates/execution/dtg-execution",
    "crates/processes/dtg-gateway",
    "crates/processes/dtg-data",
    "crates/processes/dtg-meta",
    "crates/processes/dtg-controller",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
