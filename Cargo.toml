[workspace]
members = [
    "crates/cluster-protocol",
    "crates/data-node",
    "crates/meta-node",
    "crates/shard-client",
    "crates/gateway-node",
    "crates/controller",
    "crates/temporal-types",
    "crates/timestamp-oracle",
    "crates/txn-protocol",
    "crates/control-plane",
    "crates/temporal-model",
    "crates/storage-api",
    "crates/adapter-registry",
    "crates/adapter-sidecar",
    "crates/raft-command",
    "crates/shard-runtime",
    "crates/replica-snapshot",
    "crates/raft-logstore",
    "crates/raft-transport",
    "crates/adapter-memory",
    "crates/adapter-rocksdb",
    "crates/adapter-postgres",
    "crates/adapter-neo4j",
    "crates/temporal-storage",
    "crates/temporal-ir",
    "crates/query-executor",
    "crates/cypher-ast",
    "crates/cypher-syntax",
    "crates/cypher-sema",
    "crates/cypher-compiler",
    "crates/bolt-protocol",
    "crates/bolt-server",
    "crates/physical-plan",
    "crates/query-optimizer",
    "crates/distributed-query",
    "crates/cypher-engine",
    "crates/analytics-api",
    "crates/analytics-ledger",
    "crates/analytics-runtime",
    "crates/procedure-runtime",
    "crates/dtgproxy",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
