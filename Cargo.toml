[workspace]
members = [
    "crates/temporal-types",
    "crates/temporal-model",
    "crates/storage-api",
    "crates/adapter-registry",
    "crates/adapter-sidecar",
    "crates/raft-command",
    "crates/shard-runtime",
    "crates/replica-snapshot",
    "crates/raft-logstore",
    "crates/raft-transport",
    "crates/adapter-memory",
    "crates/adapter-rocksdb",
    "crates/adapter-postgres",
    "crates/temporal-storage",
    "crates/temporal-ir",
    "crates/query-executor",
    "crates/temporal-query",
    "crates/dtgproxy",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
