name: Three Backend Migration and Deployment Matrix

on:
  push:
  pull_request:

jobs:
  migration-and-surface:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dtgproxy
          POSTGRES_PASSWORD: dtgproxy-ci-password
          POSTGRES_DB: dtgproxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtgproxy -d dtgproxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/dtgproxy-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DTGPROXY_POSTGRES_URL: host=127.0.0.1 port=5432 user=dtgproxy password=dtgproxy-ci-password dbname=dtgproxy sslmode=disable
      DTGPROXY_NEO4J_ENDPOINT: http://127.0.0.1:7474
      DTGPROXY_NEO4J_USERNAME: neo4j
      DTGPROXY_NEO4J_PASSWORD: dtgproxy-ci-password
      DTGPROXY_NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev llvm-dev cmake protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Run all six temporal graph migration directions
        run: >-
          cargo test --locked -p dtgproxy
          --features three-backend-certification
          --test three_backend_migration
          -- --test-threads=1
      - name: Run three-backend two-mode distributed surface equivalence
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          all_backends_are_equivalent_in_both_deployment_modes

  deployment-takeover-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [rocksdb, postgresql, neo4j]
        mode: [primary, shared]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dtgproxy
          POSTGRES_PASSWORD: dtgproxy-ci-password
          POSTGRES_DB: dtgproxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtgproxy -d dtgproxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/dtgproxy-ci-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DTGPROXY_POSTGRES_URL: host=127.0.0.1 port=5432 user=dtgproxy password=dtgproxy-ci-password dbname=dtgproxy sslmode=disable
      DTGPROXY_NEO4J_ENDPOINT: http://127.0.0.1:7474
      DTGPROXY_NEO4J_USERNAME: neo4j
      DTGPROXY_NEO4J_PASSWORD: dtgproxy-ci-password
      DTGPROXY_NEO4J_DATABASE: neo4j
      DTGPROXY_CERT_BACKEND: ${{ matrix.backend }}
      DTGPROXY_CERT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev llvm-dev cmake protobuf-compiler
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Certify resumable analytics takeover and Artifact byte identity
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          resumable_algorithms_are_byte_identical_after_takeover_on_every_backend_and_mode
      - name: Certify backend Sidecar restart on the owning Gateway
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          backend_sidecar_restart_recovers_degree_on_every_backend_and_mode
      - name: Certify backend Sidecar restart with cross-Gateway takeover
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          backend_sidecar_restart_allows_cross_gateway_degree_takeover
      - name: Certify tombstone GC crash recovery and concurrent Gateway fencing
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          tombstone_gc_recovers_at_every_boundary_on_every_backend_and_mode
      - name: Certify ordered Gateway Meta Shard and backend restart recovery
        run: >-
          scripts/run-exact-cargo-test.sh gateway-node
          three-backend-certification three_backend_deployment
          ordered_full_stack_restart_recovers_on_every_backend_and_mode
