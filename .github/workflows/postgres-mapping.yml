name: PostgreSQL Native Mapping

on:
  push:
  pull_request:

jobs:
  postgres-mapping:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dtgproxy
          POSTGRES_PASSWORD: dtgproxy-ci-password
          POSTGRES_DB: dtgproxy
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtgproxy -d dtgproxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DTGPROXY_POSTGRES_URL: host=127.0.0.1 port=5432 user=dtgproxy password=dtgproxy-ci-password dbname=dtgproxy sslmode=disable
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev llvm-dev cmake
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Run PostgreSQL Mapping certification
        run: cargo test --locked -p adapter-postgres -- --test-threads=1
