name: Neo4j native provider

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/storage/dtg-storage-neo4j/**"
      - "crates/storage/dtg-storage/**"
      - "scripts/test-neo4j-live.sh"

jobs:
  live-tck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/test-neo4j-live.sh
