name: Kuzu native provider

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/storage/dtg-storage-kuzu/**"
      - "crates/storage/dtg-storage/**"

jobs:
  storage-tck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p dtg-storage-kuzu --test storage_tck
